[project]
name = "shortlist"
version = "0.1.0"
description = "Reusable Python-first project template self-test harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "openai-agents>=0,<1",
  "prefect>=3,<4",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.34,<1",
]

[project.scripts]
shortlist = "shortlist.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortlist"]

[tool.pytest.ini_options]
addopts = "-ra -W error::DeprecationWarning"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.app-template.github]
# The repository that a user-started Codex session may inspect or update.
# `scripts/bootstrap_template.py` requires a replacement value for copied projects.
repository = "successbycs/ShortList"
